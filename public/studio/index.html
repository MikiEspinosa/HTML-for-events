<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A.U.R.A. · IESE Alumni</title>
  <link rel="icon" href="/brand/icons/email.png">
  <link rel="stylesheet" href="/studio/studio.css">
  <script type="module" src="/studio/studio.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Inicio">
      <img src="/brand/iese-alumni.png" alt="IESE Alumni" width="180" height="31">
      <span class="aura" tabindex="0" aria-describedby="aura-tip">A.U.R.A.<span id="aura-tip" class="aura-tip" role="tooltip">Automated UI Rendering Assistant</span></span>
    </a>
    <div class="topbar-right">
      <span id="mode" class="mode" hidden></span>
      <div class="who"><span id="user" class="user"></span><a id="logout" class="logout" href="/.auth/logout?post_logout_redirect_uri=/studio/" hidden>Cerrar sesión</a></div>
    </div>
  </header>
  <nav id="stepper" class="stepper" aria-label="Pasos" hidden></nav>
  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>
  <main id="app" class="app" tabindex="-1"></main>
  <dialog id="dialog"><form method="dialog" id="dialog-body"></form></dialog>
  <noscript>Activa JavaScript para usar el estudio.</noscript>
</body>
</html>
